name: Build dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: macos-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Build dylib
      run: |
        make


    - name: Check output
      run: |
        file UniversalPerformance.dylib
        ls -lh UniversalPerformance.dylib


    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: UniversalPerformance-dylib
        path: UniversalPerformance.dylib
