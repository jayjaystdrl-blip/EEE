name: Build UniversalPerformanceKit

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS framework
        run: |
          xcodebuild \
          -scheme UniversalPerformanceKit \
          -configuration Release \
          -sdk iphoneos \
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Package output
        run: |
          mkdir output
          cp -R ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.framework output/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalPerformanceKit-build
          path: output
